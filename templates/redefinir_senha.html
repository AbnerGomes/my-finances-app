<!DOCTYPE html>
<html lang="pt-br">
<head>
	<title>Redefinir senha — Dois no Azul</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/util.css') }}">
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/login.css') }}">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-design-iconic-font@2.2.0/dist/css/material-design-iconic-font.min.css">
	<link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon">
	<meta name="robots" content="noindex, follow">
</head>
<body>

	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">

				{% with messages = get_flashed_messages(with_categories=true) %}
				  {% if messages %}
				  <script>
				    window.MENSAGENS_FLASH = {{ messages | tojson }};
				  </script>
				  {% endif %}
				{% endwith %}

				<form method="POST" action="{{ url_for('gasto.redefinir_senha') }}" class="login100-form validate-form">
					<span class="login100-form-title p-b-26">
						Digite o código
					</span>
					<span class="login100-form-title p-b-48" style="font-size: 13px; font-weight: 400; opacity: 0.75; text-align: center;">
						Enviamos um código de 6 dígitos pro seu e-mail. Ele vale por 15 minutos.
					</span>

					<input type="hidden" name="email" value="{{ email or '' }}">

					<div class="wrap-input100 validate-input" data-validate="Informe o código">
						<input class="input100" type="text" name="codigo" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
						<span class="focus-input100" data-placeholder="Código de 6 dígitos"></span>
					</div>

					<div class="wrap-input100 validate-input" data-validate="Informe a nova senha">
						<span class="btn-show-pass">
							<i class="zmdi zmdi-eye"></i>
						</span>
						<input class="input100" type="password" name="nova_senha">
						<span class="focus-input100" data-placeholder="Nova senha"></span>
					</div>

					<div class="wrap-input100 validate-input" data-validate="Confirme a nova senha">
						<span class="btn-show-pass">
							<i class="zmdi zmdi-eye"></i>
						</span>
						<input class="input100" type="password" name="confirmar_senha">
						<span class="focus-input100" data-placeholder="Confirmar nova senha"></span>
					</div>

					<div class="container-login100-form-btn">
						<div class="wrap-login100-form-btn">
							<div class="login100-form-bgbtn"></div>
							<button class="login100-form-btn" type="submit">
								Redefinir senha
							</button>
						</div>
					</div>

					<div class="text-center" style="margin-top: 16px;">
						<a class="txt2" href="{{ url_for('gasto.esqueci') }}">
							Não recebeu? Pedir novo código
						</a>
					</div>
					<br>
					<div class="text-center">
						<a class="txt2" href="{{ url_for('gasto.login') }}">
							Voltar pro login
						</a>
					</div>
				</form>

			</div>
		</div>
	</div>

	<div id="toast" class="toast"></div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</body>
</html>
